<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualización de postulación - Chambing</title>
<style>
  body{margin:0;padding:0;font-family:'Poppins',Arial,sans-serif;background:#f4f4f7;color:#333}
  .container{max-width:600px;margin:20px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .header{background:linear-gradient(135deg,#4b208c,#6a3ab0);padding:28px 20px;text-align:center;color:#fff}
  .header h1{margin:0;font-size:26px}
  .content{padding:32px 28px}
  .content h2{color:#4b208c;margin-top:0}
  .btn{display:inline-block;background:#4b208c;color:#fff!important;text-decoration:none;padding:12px 28px;border-radius:30px;font-weight:600;margin:20px 0}
  .fase{background:#f9f7fc;border-left:4px solid #4b208c;padding:12px 16px;border-radius:6px;margin:16px 0;font-size:16px}
  .footer{background:#f8f8f8;padding:16px;text-align:center;font-size:12px;color:#777}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Chambing</h1><p style="margin:4px 0 0;opacity:.9">Actualización de proceso</p></div>
  <div class="content">
    <h2>Tu postulación avanzó</h2>
    <p>Hola <strong>{{nombreUsuario}}</strong>,</p>
    <p>Tu postulación a <strong>{{propuestaTitulo}}</strong> pasó a:</p>
    <div class="fase"><strong>{{faseActual}}</strong></div>
    <p>{{mensajeAdicional}}</p>
    <div style="text-align:center">
      <a href="{{urlBase}}/proposals-states?postulacion={{idPostulacion}}&utm_source=email&utm_medium=notification&utm_campaign=cambio_fase" class="btn">Ver estado actual</a>
    </div>
  </div>
  <div class="footer">Chambing · Cartagena de Indias</div>
</div>
</body>
</html>
